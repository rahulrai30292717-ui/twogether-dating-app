name: Build Twogether APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Build Cordova Android
      run: |
        npm install -g cordova
        cordova create app com.twogether.datingapp Twogether
        cp index.html app/www/index.html
        cd app
        cordova platform add android
        cordova build android --debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Twogether_Dating_App_APK
        path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
