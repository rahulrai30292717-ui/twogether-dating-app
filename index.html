<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Twogether</title>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background: #000; color: #111; height: 100vh; overflow: hidden; display: flex; justify-content: center; align-items: center; }
  .app-container { width: 100%; max-width: 450px; height: 100%; position: relative; background: #fff; overflow: hidden; display: flex; flex-direction: column; }
  
  .view { display: none; width: 100%; height: 100%; flex-direction: column; position: absolute; top: 0; left: 0; background: #fff; }
  .view.active { display: flex; }
  .view.dark { background: #111419; color: #fff; }

  /* Splash */
  .splash-view { background: linear-gradient(180deg, #fd297b 0%, #ff5864 50%, #ff655b 100%); color: #fff; padding: 40px 24px; justify-content: space-between; align-items: center; text-align: center; }
  .tinder-logo { font-size: 44px; font-weight: 900; letter-spacing: -1px; margin-top: 130px; }
  .auth-btns { width: 100%; display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
  .auth-btn { width: 100%; padding: 15px; border-radius: 30px; border: none; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; background: #fff; color: #222; }

  /* Forms */
  .form-view { padding: 24px; flex-direction: column; justify-content: space-between; }
  .back-btn { font-size: 26px; cursor: pointer; width: 30px; margin-bottom: 15px; }
  .phone-input-wrap { display: flex; align-items: center; border-bottom: 2px solid #222; padding: 10px 0; margin-top: 30px; font-size: 20px; font-weight: 700; }
  .phone-input-wrap input { border: none; outline: none; font-size: 20px; font-weight: 700; width: 100%; margin-left: 10px; }

  /* OTP */
  .otp-boxes { display: flex; justify-content: space-between; margin: 35px 0 20px; }
  .otp-boxes input { width: 42px; height: 50px; border: none; border-bottom: 2.5px solid #ccc; text-align: center; font-size: 24px; font-weight: 800; outline: none; }
  .otp-boxes input:focus { border-bottom-color: #fe3c72; }

  .btn-submit { width: 100%; padding: 16px; border-radius: 30px; border: none; background: #e9ecef; color: #adb5bd; font-weight: 700; font-size: 16px; cursor: pointer; }
  .btn-submit.active-btn { background: linear-gradient(45deg, #fd297b, #ff655b); color: #fff; box-shadow: 0 4px 15px rgba(253,41,123,0.3); }

  /* Main Feed */
  .top-bar { height: 56px; display: flex; justify-content: space-between; align-items: center; padding: 0 16px; background: #fff; border-bottom: 1px solid #eee; z-index: 10; }
  .dark .top-bar { background: #111419; border-bottom: 1px solid #222; }
  .logo-text { font-size: 22px; font-weight: 900; background: linear-gradient(45deg, #fd297b, #ff655b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .wallet-pill { display: flex; align-items: center; gap: 6px; background: #fff4d9; border: 1.5px solid #ffb800; padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: 800; color: #d48806; cursor: pointer; }

  .bottom-nav { height: 54px; background: #fff; border-top: 1px solid #eee; display: flex; justify-content: space-around; align-items: center; z-index: 10; }
  .dark .bottom-nav { background: #111419; border-top: 1px solid #222; }
  .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: #7c8591; font-weight: 700; cursor: pointer; gap: 3px; }
  .nav-item.active { color: #fe3c72; }
  .nav-icon { font-size: 20px; }

  .swipe-area { flex: 1; position: relative; background: #000; overflow: hidden; }
  .profile-card { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-size: cover; background-position: center; display: flex; flex-direction: column; justify-content: space-between; padding: 16px; border-radius: 12px; margin: 6px; }
  .top-banner { background: #fff; color: #111; border-radius: 20px; padding: 6px 12px; font-size: 12px; font-weight: 700; align-self: center; }
  .card-gradient { position: absolute; bottom: 0; left: 0; right: 0; height: 50%; background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, transparent 100%); border-radius: 12px; }
  .card-content { position: relative; z-index: 2; color: #fff; margin-bottom: 75px; }
  .tag-pill { background: rgba(255,255,255,0.2); backdrop-filter: blur(5px); padding: 5px 12px; border-radius: 15px; font-size: 12px; font-weight: 600; margin-right: 6px; margin-top: 6px; display: inline-block; }
  .swipe-btns { position: absolute; bottom: 12px; left: 0; right: 0; display: flex; justify-content: center; gap: 30px; z-index: 5; }
  .s-btn { width: 60px; height: 60px; border-radius: 50%; border: none; font-size: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .s-pass { background: #21262e; color: #fd297b; }
  .s-like { background: #fe3c72; color: #fff; }
</style>
</head>
<body>

<div class="app-container">
  <div id="recaptcha-container"></div>

  <!-- Splash Screen -->
  <div class="view splash-view active" id="viewSplash">
    <div class="tinder-logo">🔥 Twogether</div>
    <div class="auth-btns">
      <p style="font-size: 11px; margin-bottom: 8px; opacity: 0.9;">100% Real Users • 7 Days Free Access</p>
      <button class="auth-btn" onclick="openPhoneInput()"><span>📞</span> Continue with Phone Number</button>
      <button class="auth-btn" onclick="switchView('viewLocation')"><span>🌐</span> Continue with Google</button>
    </div>
  </div>

  <!-- Phone Screen -->
  <div class="view form-view" id="viewPhone">
    <div>
      <div class="back-btn" onclick="switchView('viewSplash')">←</div>
      <h1 style="font-size: 28px; font-weight: 800; margin-bottom: 8px;">My number is</h1>
      <p style="color: #666; font-size: 14px;">Google will send an official SMS code to verify.</p>
      <div class="phone-input-wrap">
        <span>🇮🇳 +91</span>
        <input type="tel" id="userPhoneNumber" placeholder="Enter Mobile Number" maxlength="10" oninput="checkPhoneLength(this)">
      </div>
    </div>
    <div>
      <button class="btn-submit" id="btnPhoneNext" onclick="sendOtpCode()">Send SMS Code</button>
    </div>
  </div>

  <!-- OTP Screen -->
  <div class="view form-view" id="viewOtp">
    <div>
      <div class="back-btn" onclick="switchView('viewPhone')">←</div>
      <h1 style="font-size: 28px; font-weight: 800; margin-bottom: 8px;">Enter SMS code</h1>
      <p style="color: #666; font-size: 14px;" id="otpSentPhoneTxt">Enter the 6-digit code</p>
      <div class="otp-boxes">
        <input type="tel" maxlength="1" oninput="handleOtp(this, 0)">
        <input type="tel" maxlength="1" oninput="handleOtp(this, 1)">
        <input type="tel" maxlength="1" oninput="handleOtp(this, 2)">
        <input type="tel" maxlength="1" oninput="handleOtp(this, 3)">
        <input type="tel" maxlength="1" oninput="handleOtp(this, 4)">
        <input type="tel" maxlength="1" oninput="handleOtp(this, 5)">
      </div>
    </div>
    <div>
      <button class="btn-submit" id="btnOtpVerify" onclick="verifyOtpCode()">Verify & Continue</button>
    </div>
  </div>

  <!-- Location Screen -->
  <div class="view form-view" id="viewLocation" style="text-align: center;">
    <div>
      <h1 style="font-size: 26px; font-weight: 800; margin-top: 20px;">Allow GPS Location</h1>
      <p style="color: #666; font-size: 14px; margin-top: 15px; line-height: 1.4;">Match with verified real people in your neighborhood.</p>
    </div>
    <div style="width:100px; height:100px; border-radius:50%; background:#f0f2f5; display:flex; align-items:center; justify-content:center; margin:40px auto; font-size:45px;">📍</div>
    <div>
      <button class="btn-submit active-btn" style="background: #111; color: #fff;" onclick="switchTab('viewSwipe')">Allow Location</button>
    </div>
  </div>

  <!-- Swipe Screen -->
  <div class="view dark" id="viewSwipe">
    <div class="top-bar">
      <div class="logo-text">🔥 Twogether</div>
      <div class="wallet-pill">🪙 50 Coins</div>
    </div>
    <div class="swipe-area" id="swipeCardArea"></div>
    <div class="bottom-nav">
      <div class="nav-item active"><span class="nav-icon">🔥</span>Swipe</div>
      <div class="nav-item"><span class="nav-icon">💬</span>Chat</div>
      <div class="nav-item"><span class="nav-icon">👤</span>Profile</div>
    </div>
  </div>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBg4J1w0uXAbMDTz84s6iDsBwG5hh_FFzk",
  authDomain: "twogether-dating.firebaseapp.com",
  projectId: "twogether-dating",
  storageBucket: "twogether-dating.firebasestorage.app",
  messagingSenderId: "97773407634",
  appId: "1:97773407634:web:b1db2aefc95e13c3f0454b"
};

if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}

let confirmationResult = null;

function switchView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function switchTab(id) {
  switchView(id);
  if (id === 'viewSwipe') renderCard();
}

function openPhoneInput() {
  document.getElementById('userPhoneNumber').value = '';
  document.getElementById('btnPhoneNext').classList.remove('active-btn');
  switchView('viewPhone');
}

function checkPhoneLength(el) {
  const btn = document.getElementById('btnPhoneNext');
  if (el.value.length === 10) {
    btn.classList.add('active-btn');
  } else {
    btn.classList.remove('active-btn');
  }
}

function sendOtpCode() {
  const phone = document.getElementById('userPhoneNumber').value.trim();
  if (phone.length < 10) return;

  const btn = document.getElementById('btnPhoneNext');
  btn.innerText = "Requesting SMS...";
  btn.disabled = true;

  const fullPhoneNumber = "+91" + phone;
  document.getElementById('otpSentPhoneTxt').innerText = "Code sent to " + fullPhoneNumber;

  if (!window.recaptchaVerifier) {
    window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
      'size': 'invisible'
    });
  }

  firebase.auth().signInWithPhoneNumber(fullPhoneNumber, window.recaptchaVerifier)
    .then((res) => {
      confirmationResult = res;
      btn.innerText = "Send SMS Code";
      btn.disabled = false;
      switchView('viewOtp');
    })
    .catch((err) => {
      btn.innerText = "Send SMS Code";
      btn.disabled = false;
      alert(err.message);
    });
}

function handleOtp(el, idx) {
  if (el.value.length === 1 && el.nextElementSibling) {
    el.nextElementSibling.focus();
  }
  let fullOtp = '';
  document.querySelectorAll('.otp-boxes input').forEach(inp => fullOtp += inp.value);
  if (fullOtp.length === 6) {
    document.getElementById('btnOtpVerify').classList.add('active-btn');
  } else {
    document.getElementById('btnOtpVerify').classList.remove('active-btn');
  }
}

function verifyOtpCode() {
  let enteredOtp = '';
  document.querySelectorAll('.otp-boxes input').forEach(inp => enteredOtp += inp.value);
  if (enteredOtp.length < 6) return;

  if (confirmationResult) {
    confirmationResult.confirm(enteredOtp)
      .then(() => switchView('viewLocation'))
      .catch(() => alert("❌ Invalid SMS Code. Please re-check."));
  } else {
    switchView('viewLocation');
  }
}

function renderCard() {
  const area = document.getElementById('swipeCardArea');
  area.innerHTML = `
    <div class="profile-card" style="background-image: url('https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=600');">
      <div class="top-banner">📍 2.3 km away • Verified Real User</div>
      <div class="card-gradient"></div>
      <div class="card-content">
        <h1 style="font-size: 28px; font-weight:800;">Sabina Shaikh 22 ✔</h1>
        <div style="font-size: 13px; margin: 4px 0 10px;">📍 GPS Matched Near You</div>
      </div>
      <div class="swipe-btns">
        <button class="s-btn s-pass">✕</button>
        <button class="s-btn s-like">❤</button>
      </div>
    </div>
  `;
}
</script>
</body>
</html>
