<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Twogether - 100% Real Matches</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: #0f1015; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
  .app-container { width: 100%; max-width: 420px; height: 100%; max-height: 850px; position: relative; background: #181920; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; }
  .screen { display: none; width: 100%; height: 100%; flex-direction: column; position: absolute; top: 0; left: 0; background: #181920; }
  .screen.active { display: flex; }

  /* Top Bar */
  .header { height: 56px; display: flex; justify-content: space-between; align-items: center; padding: 0 16px; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .header-brand { font-size: 20px; font-weight: 800; background: linear-gradient(45deg, #ff416c, #ff4b4b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .trial-badge { background: rgba(255, 193, 7, 0.15); border: 1px solid #ffc107; color: #ffc107; font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 12px; cursor: pointer; }

  /* Card View */
  .card-stack { flex: 1; position: relative; margin: 12px; }
  .card { position: absolute; top: 0; left: 0; right: 0; bottom: 0; border-radius: 16px; overflow-y: auto; background: #23242f; transition: transform 0.25s, opacity 0.25s; }
  .card img { width: 100%; height: 380px; object-fit: cover; display: block; }
  .card-details { padding: 16px; }
  .verified-badge { color: #2ed573; font-size: 14px; margin-left: 5px; }
  .name-age { font-size: 22px; font-weight: 700; }
  .location { font-size: 13px; color: #aaa; margin-top: 3px; }
  .bio { font-size: 14px; margin-top: 10px; line-height: 1.4; color: #ddd; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .tag { background: rgba(255,255,255,0.08); padding: 5px 10px; border-radius: 15px; font-size: 12px; color: #ff758c; }

  /* Buttons */
  .actions { height: 75px; display: flex; justify-content: space-evenly; align-items: center; padding-bottom: 8px; }
  .action-btn { width: 54px; height: 54px; border-radius: 50%; border: none; font-size: 22px; cursor: pointer; }
  .btn-pass { background: #23242f; color: #ff4757; }
  .btn-heart { background: linear-gradient(45deg, #ff416c, #ff4b4b); color: #fff; }
  .btn-primary { width: 100%; padding: 14px; border-radius: 30px; border: none; background: linear-gradient(45deg, #ff416c, #ff4b4b); color: #fff; font-weight: 700; font-size: 16px; cursor: pointer; }

  /* Paywall Screen */
  .paywall-bg { background: linear-gradient(135deg, #181920 0%, #30131e 100%); padding: 30px 20px; justify-content: space-between; text-align: center; }
  .plan-card { background: #23242f; border: 2px solid #ff416c; padding: 16px; border-radius: 16px; margin: 12px 0; text-align: left; position: relative; }
  .plan-popular { position: absolute; top: -10px; right: 15px; background: #ff416c; color: #fff; font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 10px; }

  /* Modal */
  .modal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,16,21,0.96); z-index: 99; flex-direction: column; }
  .modal.active { display: flex; }
</style>
</head>
<body>

<div class="app-container">
  <!-- Feed Screen -->
  <div class="screen active" id="screenMain">
    <div class="header">
      <span class="header-brand">🔥 Twogether</span>
      <span class="trial-badge" onclick="showPaywall()">⏳ 7 Days Free Trial</span>
      <span style="font-size: 20px; cursor:pointer;" onclick="alert('Profile section')">👤</span>
    </div>
    <div class="card-stack" id="feedCards"></div>
    <div class="actions">
      <button class="action-btn btn-pass" onclick="handleSwipe('left')">✕</button>
      <button class="action-btn btn-heart" onclick="handleSwipe('right')">❤</button>
    </div>
  </div>

  <!-- Subscription Paywall (7 Days Expire Screen) -->
  <div class="screen paywall-bg" id="screenPaywall">
    <div>
      <h2 style="font-size: 26px; font-weight: 800; margin-top: 20px;">Unlock Full Access 💎</h2>
      <p style="color: #aaa; font-size: 13px; margin-top: 6px;">Your 7-day free trial gives unlimited matches.</p>
    </div>

    <div>
      <div class="plan-card">
        <div class="plan-popular">BEST VALUE</div>
        <div style="font-size: 18px; font-weight: 700;">1 Month Premium</div>
        <div style="font-size: 13px; color: #bbb;">Unlimited Swipes + Real Chat + 100% Real ID verified</div>
        <div style="font-size: 20px; font-weight: 800; color: #ff416c; margin-top: 8px;">₹199 / month</div>
      </div>

      <div class="plan-card" style="border-color: rgba(255,255,255,0.1);">
        <div style="font-size: 18px; font-weight: 700;">3 Months Access</div>
        <div style="font-size: 13px; color: #bbb;">Save 25% on long-term matching</div>
        <div style="font-size: 20px; font-weight: 800; color: #ff758c; margin-top: 8px;">₹449 only</div>
      </div>
    </div>

    <div>
      <button class="btn-primary" onclick="alert('Razorpay/UPI Payment Gateway connected!')">Continue & Pay</button>
      <p style="font-size: 11px; color: #666; margin-top: 10px; cursor: pointer;" onclick="document.getElementById('screenPaywall').classList.remove('active'); document.getElementById('screenMain').classList.add('active');">Back to app</p>
    </div>
  </div>
</div>

<script>
let remainingDays = 7;
let currentIdx = 0;

// Verified real profiles structure (Real users will load from backend database)
const realUsers = [
  {
    name: "Pooja Hegde",
    age: 24,
    city: "Kothrud, Pune",
    bio: "CA Student. Love long drives & chai. Looking for serious genuine connection. ✨",
    tags: ["Music", "Reading", "Chai", "Travel"],
    image: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=600"
  },
  {
    name: "Rohan Kulkarni",
    age: 26,
    city: "Kalyani Nagar, Pune",
    bio: "Software developer by day, guitarist by night. Let's grab coffee! ☕",
    tags: ["Tech", "Guitar", "Fitness", "Movies"],
    image: "https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=600"
  }
];

function renderCard() {
  const stack = document.getElementById('feedCards');
  stack.innerHTML = '';
  if (currentIdx >= realUsers.length) {
    stack.innerHTML = '<div style="display:flex;height:100%;justify-content:center;align-items:center;color:#888;text-align:center;padding:20px;">Finding more 100% verified real users nearby...</div>';
    return;
  }
  const u = realUsers[currentIdx];
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <img src="${u.image}">
    <div class="card-details">
      <div class="name-age">${u.name}, ${u.age} <span class="verified-badge">✔ Verified</span></div>
      <div class="location">📍 ${u.city}</div>
      <div class="bio">${u.bio}</div>
      <div class="tags">${u.tags.map(t => `<span class="tag">#${t}</span>`).join('')}</div>
    </div>
  `;
  stack.appendChild(card);
}

function handleSwipe(dir) {
  const card = document.querySelector('.card');
  if (!card) return;
  card.style.transform = dir === 'left' ? 'translateX(-120%) rotate(-15deg)' : 'translateX(120%) rotate(15deg)';
  card.style.opacity = '0';
  setTimeout(() => {
    currentIdx++;
    renderCard();
  }, 250);
}

function showPaywall() {
  document.getElementById('screenMain').classList.remove('active');
  document.getElementById('screenPaywall').classList.add('active');
}

renderCard();
</script>
</body>
</html>
